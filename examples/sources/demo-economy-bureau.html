      <p class="news-summary">面向示例市制造业企业开展智能工厂梯度培育申报，明确基础级、先进级、卓越级三个层级。</p>
      <template class="demo-detail">
        <article class="policy-detail">
          <h1>关于组织开展2026年度示例市智能工厂梯度培育申报工作的通知</h1>
          <div class="meta">
            <span class="issuer">示例市经济和信息化局</span>
            <span class="publish-date">2026-11-09</span>
            <span class="doc-number">示例经信〔2026〕42号</span>
          </div>
          <p class="lead">为加快推动制造业数字化转型，现组织开展2026年度示例市智能工厂梯度培育申报工作。</p>
          <div class="article-body">
            <p>各区经济和信息化主管部门、各有关单位：</p>
            <p>为加快推动制造业数字化转型，现组织开展2026年度示例市智能工厂梯度培育申报工作。有关事项通知如下。</p>
            <h2>一、申报对象</h2>
            <p>在示例市依法登记注册、具有独立法人资格的制造业企业，经营状况良好，近三年无重大安全、质量、环保事故和严重失信记录。</p>
            <h2>二、申报层级</h2>
            <p>智能工厂梯度培育分为基础级、先进级和卓越级。企业可对照《示例市智能工厂梯度培育评价指引》自愿申报，同一企业原则上每年申报一个层级。</p>
            <h2>三、申报材料</h2>
            <p>（一）示例市智能工厂梯度培育申报书；</p>
            <p>（二）企业数字化转型现状与建设方案；</p>
            <p>（三）相关佐证材料，包括系统上线证明、数据采集记录、第三方评估报告等。</p>
            <h2>四、申报流程</h2>
            <p>申报单位通过示例市企业服务云提交材料，各区主管部门进行初审，示例市经济和信息化局组织专家评审和现场核查。</p>
            <h2>五、时间安排</h2>
            <p>请各申报单位于2026年12月5日17:00前完成线上提交，各区主管部门于2026年12月12日前完成初审推荐。逾期不予受理。</p>
            <h2>六、其他事项</h2>
            <p>申报单位应对材料真实性负责。对弄虚作假的，取消申报资格并按规定处理。</p>
          </div>

    <li class="news-item">

        <span class="news-title">关于开展2026年示例市“数据要素×智能制造”典型案例征集的通知</span>
        <time class="news-date" datetime="2026-11-12">2026-11-12</time>
      </a>
      <p class="news-summary">征集数据驱动的研发设计、生产制造、供应链协同、质量追溯、绿色低碳管理等典型案例。</p>
      <template class="demo-detail">
        <article class="policy-detail">
          <h1>关于开展2026年示例市“数据要素×智能制造”典型案例征集的通知</h1>
          <div class="meta">
            <span class="issuer">示例市经济和信息化局</span>
            <span class="publish-date">2026-11-12</span>
            <span class="doc-number">示例经信〔2026〕45号</span>
          </div>
          <p class="lead">为挖掘数据要素赋能制造业的典型做法，现开展2026年示例市“数据要素×智能制造”典型案例征集。</p>
          <div class="article-body">
            <p>各有关单位：</p>
            <p>为挖掘数据要素赋能制造业的典型做法，现开展2026年示例市“数据要素×智能制造”典型案例征集。有关事项通知如下。</p>
            <h2>一、征集方向</h2>
            <p>（一）数据驱动的研发设计；（二）数据驱动的生产制造；（三）数据驱动的供应链协同；（四）数据驱动的质量追溯；（五）数据驱动的绿色低碳管理。</p>
            <h2>二、申报主体</h2>
            <p>在示例市注册、具有独立法人资格的制造业企业、软件和信息技术服务企业、科研院所等，可单独申报或联合申报。</p>
            <h2>三、案例要求</h2>
            <p>案例应具有真实性、创新性和可复制性，已实际运行六个月以上，并取得可量化的经济或社会效益。涉及数据的，应说明数据来源、授权方式和安全保护措施。</p>
            <h2>四、申报方式</h2>
            <p>申报单位填写《示例市“数据要素×智能制造”典型案例申报表》，于2026年12月20日前发送至示例市经济和信息化局指定受理渠道。具体方式见申报表。</p>
            <h2>五、成果运用</h2>
            <p>入选案例将纳入示例市数据要素应用案例库，并通过交流活动、培训等方式推广。对特别优秀的案例，推荐参加上级部门组织的相关活动。</p>
          </div>
        </article>
