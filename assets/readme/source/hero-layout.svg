<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="440" viewBox="0 0 1200 440"
     role="img" aria-labelledby="title desc">
  <title id="title">Policy Monitor Workflow</title>
  <desc id="desc">A local-first policy monitoring workflow on a calm cool porcelain-mist canvas: fetch sources, archive HTML snapshots, track changes, render drafts, and hand off to human review.</desc>

  <!-- Cool Porcelain-Mist Background (distinct from warm-paper workbench) -->
  <rect width="1200" height="440" rx="18" fill="#F3F6FA"/>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="18" fill="none" stroke="#DCE4EE"/>

  <!-- Left Editorial Title Block (inspired by clean structured simplicity, zero corner clutter) -->
  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="64" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="1.6" fill="#5B6B80">POLICY MONITOR WORKFLOW</text>

    <!-- Short cobalt signature bar -->
    <rect x="64" y="82" width="40" height="3.5" rx="1.75" fill="#3456A8"/>

    <!-- Editorial Serif / Bold Display Title -->
    <text x="64" y="152" font-family="Georgia, 'Songti SC', 'Noto Serif SC', 'PingFang SC', serif" font-size="54" font-weight="700" fill="#162235">政策监测工作流</text>
    <text x="64" y="206" font-size="22" fill="#425268">抓信源、留快照、记变更、出草稿，把最终判断留给人。</text>

    <!-- Clean 2x2 plain-text artifact index (no pill boxes) -->
    <g transform="translate(64 252)" font-size="20">
      <circle cx="8" cy="14" r="4.5" fill="#3456A8"/>
      <text x="24" y="21" font-weight="600" fill="#162235">信源与快照</text>
      <text x="148" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#5B6B80">HTML + raw.json</text>

      <circle cx="8" cy="56" r="4.5" fill="#3456A8"/>
      <text x="24" y="63" font-weight="600" fill="#162235">索引与流水</text>
      <text x="148" y="63" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#5B6B80">index.json + csv</text>

      <circle cx="348" cy="14" r="4.5" fill="#3456A8"/>
      <text x="364" y="21" font-weight="600" fill="#162235">周期草稿</text>
      <text x="466" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#5B6B80">日 / 周 / 月报</text>

      <circle cx="348" cy="56" r="4.5" fill="#B84A39"/>
      <text x="364" y="63" font-weight="600" fill="#162235">人工边界</text>
      <text x="466" y="63" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#B84A39">核校后签发</text>
    </g>

    <line x1="64" y1="364" x2="640" y2="364" stroke="#DCE4EE" stroke-width="1"/>
    <text x="64" y="396" font-size="18" fill="#5B6B80">Python 3.10+ · 零依赖离线 Demo · 可导出到工作台</text>
  </g>

  <!-- Right Archival Subject: Cleanly resting on the cool porcelain canvas -->
  <g id="hybrid-subject">
    <image href="hero-subject.png" x="710" y="62" width="436" height="296" preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
