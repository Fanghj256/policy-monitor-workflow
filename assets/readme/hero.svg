<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Policy Monitor Workflow</title>
  <desc id="desc">A source-first policy monitoring pipeline: sources, archive, index and changes, then daily weekly and monthly report drafts.</desc>

  <rect width="1200" height="360" rx="26" fill="#F4F0E8"/>
  <rect x="64" y="52" width="3" height="256" rx="1.5" fill="#B5472E"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="92" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2.2" fill="#B5472E">POLICY MONITOR WORKFLOW</text>
    <text x="92" y="138" font-size="56" font-weight="700" fill="#14161A">政策监测工作流</text>
    <text x="94" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#7A7468">Policy Monitor Workflow</text>
    <text x="92" y="224" font-size="27" fill="#14161A">把每天翻政策网站，</text>
    <text x="92" y="260" font-size="27" fill="#14161A">变成一条可复现的流水线。</text>
    <text x="92" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7A7468">Python 3.10+  ·  offline demo  ·  MIT / CC BY 4.0 / CC0</text>
  </g>

  <g id="pipeline-card" transform="translate(690 52)">
    <rect width="446" height="256" rx="18" fill="#14161A"/>
    <text x="26" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.6" fill="#B5472E">THE PIPELINE</text>
    <line x1="26" y1="54" x2="420" y2="54" stroke="#3A3733" stroke-width="1"/>

    <circle cx="30" cy="82" r="4" fill="#B5472E"/>
    <text x="46" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#F4F0E8">01  SOURCES</text>
    <text x="46" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#A8A29A">sources.yaml · 11 examples</text>

    <circle cx="30" cy="128" r="4" fill="#B5472E"/>
    <text x="46" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#F4F0E8">02  ARCHIVE</text>
    <text x="46" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#A8A29A">HTML snapshot · raw JSON</text>

    <circle cx="30" cy="174" r="4" fill="#B5472E"/>
    <text x="46" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#F4F0E8">03  INDEX</text>
    <text x="46" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#A8A29A">index.json + changes.csv</text>

    <circle cx="30" cy="220" r="4" fill="#B5472E"/>
    <text x="46" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#F4F0E8">04  REPORTS</text>
    <text x="46" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#A8A29A">daily / weekly / monthly drafts</text>
  </g>
</svg>

